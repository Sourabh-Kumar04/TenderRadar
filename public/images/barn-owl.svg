<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="owlBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3d4957"/>
      <stop offset="60%" stop-color="#1f2630"/>
      <stop offset="100%" stop-color="#10151c"/>
    </radialGradient>
    <linearGradient id="owlMantle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d99e59"/>
      <stop offset="50%" stop-color="#ab753a"/>
      <stop offset="100%" stop-color="#73491d"/>
    </linearGradient>
    <linearGradient id="owlFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#faedd9"/>
      <stop offset="100%" stop-color="#ebd1b5"/>
    </linearGradient>
    <clipPath id="owlCircleClip">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>

  <g clip-path="url(#owlCircleClip)">
    <!-- Twilight forest background with soft moon glow -->
    <rect width="100" height="100" fill="url(#owlBg)"/>
    <circle cx="50" cy="40" r="38" fill="#e8eeff" opacity="0.12"/>
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="85" cy="25" r="1.2" fill="#ffffff" opacity="0.5"/>

    <!-- Rustic barn timber perch -->
    <rect x="5" y="78" width="90" height="18" rx="2" fill="#36291c"/>
    <line x1="5" y1="81" x2="95" y2="81" stroke="#52402e" stroke-width="1.5"/>

    <!-- Tail -->
    <path d="M42 75 L 40 89 L 60 89 L 58 75 Z" fill="#b07d43"/>

    <!-- Body & folded wings with golden-buff mottling -->
    <path d="M26 48 C 22 62, 28 78, 38 80 C 50 82, 62 82, 72 78 C 78 72, 78 58, 74 48 C 68 40, 32 40, 26 48 Z" fill="url(#owlMantle)"/>

    <!-- Wing speckling -->
    <circle cx="32" cy="62" r="1.2" fill="#ffffff" opacity="0.8"/>
    <circle cx="36" cy="68" r="1.2" fill="#ffffff" opacity="0.8"/>
    <circle cx="68" cy="64" r="1.2" fill="#ffffff" opacity="0.8"/>
    <circle cx="64" cy="70" r="1.2" fill="#ffffff" opacity="0.8"/>
    <circle cx="34" cy="64" r="1" fill="#24180d"/>
    <circle cx="66" cy="66" r="1" fill="#24180d"/>

    <!-- Heart-shaped facial disc border (golden/buff) -->
    <path d="M50 24 C 42 16, 28 20, 30 36 C 31 46, 44 56, 50 60 C 56 56, 69 46, 70 36 C 72 20, 58 16, 50 24 Z" fill="#9e6d38"/>

    <!-- Heart-shaped facial disc (luminous white) -->
    <path d="M50 25.5 C 43 18, 31 22, 32.5 36 C 33.5 45, 45 54, 50 58 C 55 54, 66.5 45, 67.5 36 C 69 22, 57 18, 50 25.5 Z" fill="url(#owlFace)"/>

    <!-- Subtle eye ridges -->
    <ellipse cx="42" cy="38" rx="6" ry="7" fill="#f0dfcc" opacity="0.7"/>
    <ellipse cx="58" cy="38" rx="6" ry="7" fill="#f0dfcc" opacity="0.7"/>

    <!-- Dark, deep soulful owl eyes -->
    <circle cx="43" cy="38" r="3.2" fill="#140f0a"/>
    <circle cx="57" cy="38" r="3.2" fill="#140f0a"/>
    <circle cx="44.2" cy="36.8" r="0.9" fill="#ffffff"/>
    <circle cx="58.2" cy="36.8" r="0.9" fill="#ffffff"/>

    <!-- Delicate pale hooked beak -->
    <path d="M48.5 38 L 51.5 38 L 50 48 Z" fill="#eedcc5"/>
    <path d="M49.2 46 L 50.8 46 L 50 49 Z" fill="#c7b399"/>
  </g>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#9e6d38" stroke-width="2" opacity="0.5"/>
</svg>
